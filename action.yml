name: 'Set up tidbcloud cli'
description: |-
  Downloads, installs, and configures a `ticloud` environment.
  Adds the `ticloud` CLI command to the $PATH.
inputs:
  version:
    description: |-
      Version of the `ticloud` to install. If unspecified or set to "latest",
      the action's pinned default `ticloud` version will be installed. Example: "0.1.6".
    required: false
    default: latest
  sha256:
    description: |-
      Expected SHA-256 digest of the platform-specific CLI archive. Required
      for versions other than the action's pinned default version.
    required: false
  api_public_key:
    description: |-
      The public key of TiDB Cloud api.
    required: true
  api_private_key:
    description: |-
      The private key of TiDB Cloud api.
    required: true

branding:
  icon: 'terminal'
  color: 'gray-dark'
runs:
  using: 'node20'
  main: 'dist/index.js'
